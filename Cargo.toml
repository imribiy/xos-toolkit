[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
publish = false

[workspace.dependencies]
xos-core = { path = "crates/xos-core" }
xos-sys = { path = "crates/xos-sys" }
xos-helpers = { path = "crates/xos-helpers" }
xos-winupdate = { path = "crates/xos-winupdate" }
xos-cpu = { path = "crates/xos-cpu" }
xos-page-system = { path = "crates/xos-page-system" }
xos-page-config = { path = "crates/xos-page-config" }
xos-page-troubleshoot = { path = "crates/xos-page-troubleshoot" }
xos-page-update = { path = "crates/xos-page-update" }
xos-page-apps = { path = "crates/xos-page-apps" }
xos-page-cpu = { path = "crates/xos-page-cpu" }
xos-page-gaming = { path = "crates/xos-page-gaming" }
xos-page-network = { path = "crates/xos-page-network" }
xos-page-software = { path = "crates/xos-page-software" }
xos-page-visuals = { path = "crates/xos-page-visuals" }
xos-uninstall = { path = "crates/xos-uninstall" }
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
fancy-regex = "0.20.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
winreg = "0.56.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_Rras",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Networking_WinSock",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_RestartManager",
    "Win32_System_Rpc",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_System_Wmi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
